%YAML:1.0

verbosity: "ALL" # ALL, DEBUG, INFO, WARNING, ERROR, SILENT

use_fej: true
use_imuavg: true
use_rk4int: true
integration: "rk4"

use_stereo: false
max_cameras: 4
front_end_thread: true
# Use fixed offline calibration for stability first; enable only if you need online refinement.
calib_cam_extrinsics: true
calib_cam_intrinsics: false
# camera/imu are expected to be hw-synced on M2DGR camera rig
calib_cam_timeoffset: false
calib_imu_intrinsics: false
calib_imu_g_sensitivity: false
timeshift_cam_imu: 0.0

max_clones: 11
max_points: 200
max_slam: 70
max_slam_in_update: 10
max_msckf_in_update: 40
dt_slam_delay: 1

gravity_mag: 9.805

feat_rep_msckf: "ANCHORED_MSCKF_INVERSE_DEPTH"
feat_rep_slam: "ANCHORED_MSCKF_INVERSE_DEPTH"
feat_rep_aruco: "ANCHORED_MSCKF_INVERSE_DEPTH"

try_zupt: true
zupt_chi2_multipler: 5
zupt_max_velocity: 0.10
zupt_noise_multiplier: 50
zupt_max_disparity: 0.5
zupt_only_at_beginning: true

# ==================================================================
# Initialization
# ==================================================================

init_window_time: 3.0
init_imu_thresh: 0.20
init_max_disparity: 3.0
init_max_features: 120

init_dyn_use: true
init_dyn_mle_opt_calib: false
init_dyn_mle_max_iter: 50
init_dyn_mle_max_time: 0.05
init_dyn_mle_max_threads: 6
init_dyn_num_pose: 5
init_dyn_min_deg: 10.0

init_dyn_inflation_ori: 10
init_dyn_inflation_vel: 100
init_dyn_inflation_bg: 10
init_dyn_inflation_ba: 100
init_dyn_min_rec_cond: 1e-20

init_dyn_bias_g: [0.0, 0.0, 0.0]
init_dyn_bias_a: [0.0, 0.0, 0.0]

# ==================================================================
# Logging
# ==================================================================

record_timing_information: false
record_timing_filepath: "/tmp/traj_timing.txt"

save_total_state: false
filepath_est: "/tmp/ov_estimate.txt"
filepath_std: "/tmp/ov_estimate_std.txt"
filepath_gt: "/tmp/ov_groundtruth.txt"

# ==================================================================
# Front-end
# ==================================================================

use_klt: true
num_pts: 300
fast_threshold: 20
grid_x: 10
grid_y: 10
min_px_dist: 5
knn_ratio: 0.70
track_frequency: 20.0
downsample_cameras: false
num_opencv_threads: 4
histogram_method: "HISTOGRAM" # NONE, HISTOGRAM, CLAHE

use_aruco: false
num_aruco: 1024
downsize_aruco: true

# ==================================================================
# Noise & Config Paths
# ==================================================================

up_msckf_sigma_px: 2
up_msckf_chi2_multipler: 10
up_slam_sigma_px: 2
up_slam_chi2_multipler: 10
up_aruco_sigma_px: 1
up_aruco_chi2_multipler: 1

use_mask: false

relative_config_imu: "kalibr_imu_chain.yaml"
relative_config_imucam: "kalibr_imucam_chain.yaml"
